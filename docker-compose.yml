services:
  db:
    image: postgres:15
    container_name: prohome_b2c_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Tashqi internetga ochiq bo'lmasin — faqat `app` konteyner shu Docker
    # tarmog'i ichidan `db:5432` orqali ulanadi (DATABASE_URL_DOCKER'da host
    # nomi "db", localhost emas), shuning uchun port chiqarish shart emas.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prohome_b2c_redis
    restart: always
    # Tashqi internetga ochiq bo'lmasin — `app` konteyner ichki tarmoq
    # orqali `redis:6379`ga ulanadi (REDIS_HOST_DOCKER="redis").
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: prohome_b2c_app
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      REDIS_HOST: ${REDIS_HOST_DOCKER}
      REDIS_PORT: ${REDIS_PORT_DOCKER}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/core/uploads
    command: >
      sh -c "npx prisma db push --accept-data-loss && node dist/src/main.js"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
