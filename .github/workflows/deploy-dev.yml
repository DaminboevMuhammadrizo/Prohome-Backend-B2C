name: Deploy ProHome Backend DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_DEV_HOST }}
          username: ${{ secrets.SERVER_DEV_USER }}
          key: ${{ secrets.SERVER_DEV_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            mkdir -p /var/www/prohome/backend-dev
            cd /var/www/prohome/backend-dev

            if [ ! -d ".git" ]; then
              git clone -b dev https://x-access-token:${{ secrets.GH_DEV_TOKEN }}@github.com/tuxtasinboyev/ProHome_backend.git .
            else
              git remote set-url origin https://x-access-token:${{ secrets.GH_DEV_TOKEN }}@github.com/tuxtasinboyev/ProHome_backend.git
              git reset --hard
              git pull origin dev
            fi

            docker compose -f docker-compose.dev.yml down --remove-orphans || true
            docker compose -f docker-compose.dev.yml build --no-cache
            docker compose -f docker-compose.dev.yml up -d

            docker builder prune -f
            docker image prune -f

            echo "✅ DEV deploy finished!"